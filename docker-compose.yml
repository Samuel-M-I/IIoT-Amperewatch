services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_broker
    restart: always
    ports:
      - "8883:8883"          # Solo TLS. Se eliminó el 1883 sin cifrar.
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./certs:/mosquitto/certs

  ampere-backend:
    build: ./backend
    container_name: ampere_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./certs/ca.crt:/certs/ca.crt:ro
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=8883
      - MQTT_CA_CERT=/certs/ca.crt
      - MQTT_USER=${MQTT_BACKEND_USER}
      - MQTT_PASSWORD=${MQTT_BACKEND_PASSWORD}
    depends_on:
      - mqtt-broker

  simulador-esp32:
    build: ./sim
    container_name: simulador_esp32
    restart: always
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=8883
      - MQTT_CA_CERT=/certs/ca.crt
      - MQTT_USER=${MQTT_DEVICE_USER}
      - MQTT_PASSWORD=${MQTT_DEVICE_PASSWORD}
    depends_on:
      - mqtt-broker
      - ampere-backend
