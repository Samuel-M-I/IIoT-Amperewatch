services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_broker
    restart: always
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./certs:/mosquitto/certs

  ampere-backend:
    build: ./backend
    container_name: ampere_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - MQTT_BROKER=mqtt-broker
    depends_on:
      - mqtt-broker

  simulador-esp32:
    build: ./sim
    container_name: simulador_esp32
    restart: always
    depends_on:
      - mqtt-broker
      - ampere-backend
