# AmpereWatch - Proxy inverso HTTPS
# Es lo único expuesto a la red (80 y 443). El backend Flask queda oculto dentro de Docker.

# Segundo freno contra adivinar contraseñas (además del límite de la propia app)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# ---------- Puerto 80: solo redirige a HTTPS (y sirve la CA pública) ----------
server {
    listen 80;
    server_name _;

    # Certificado PÚBLICO de la CA, para instalarlo en el navegador/celular una sola vez
    location = /ca.crt {
        alias /certs/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="amperewatch-ca.crt"';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Puerto 443: HTTPS ----------
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/web.crt;
    ssl_certificate_key /certs/web.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    # Resolución de nombres de Docker (así nginx arranca aunque el backend tarde en levantar)
    resolver 127.0.0.11 valid=10s;
    set $backend http://ampere-backend:5000;

    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
